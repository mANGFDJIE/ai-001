<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги рядом</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #e0f7fa;}
       .header {background: #00bfff; padding: 20px; text-align: center; color: white;}
        main {padding: 20px;}
       .service {margin: 10px 0; padding: 15px; background: white; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);}
       .service h3 {margin: 0; color: #00bfff;}
       .service ul {list-style: none; padding: 0;}
    </style>
</head>
<body>
    <div class="header">
        <h1>Услуги рядом</h1>
    </div>
    <main>
        <div class="service">
            <h3>Моечный Сервис</h3>
            <ul>
                <li>Автомойка</li>
                <li>Химчистка</li>
                <li>Прочее</li>
            </ul>
        </div>
        <div class="service">
            <h3>Ремонтные услуги</h3>
            <ul>
                <li>Электрик</li>
                <li>Пластиковый цех</li>
                <li>Прочее</li>
            </ul>
        </div>
    </main>
</body>
</html>
