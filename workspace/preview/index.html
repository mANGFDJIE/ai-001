<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Услуги рядом</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<header class="header">
  <h1 class="logo">Услуги рядом</h1>
  <input type="text" id="search" placeholder="Найти услугу" class="search-input">
</header>
<main class="main">
  <div class="grid" id="cards"></div>
</main>

<script>
const services = [
  {id:1, title:'Стиральная машина', img:'https://picsum.photos/300/200?random=1', price:2000, rating:4.5, location:'Москва'},
  {id:2, title:'Сборка мебели', img:'https://picsum.photos/300/200?random=2', price:1500, rating:4.2, location:'Санкт-Петербург'},
  {id:3, title:'Покраска стен', img:'https://picsum.photos/300/200?random=3', price:3000, rating:4.8, location:'Новосибирск'},
  {id:4, title:'Уборка квартиры', img:'https://picsum.photos/300/200?random=4', price:1200, rating:4.3, location:'Екатеринбург'},
  {id:5, title:'Ремонт компьютера', img:'https://picsum.photos/300/200?random=5', price:1800, rating:4.6, location:'Казань'},
  {id:6, title:'Курсы английского', img:'https://picsum.photos/300/200?random=6', price:5000, rating:4.9, location:'Ростов-на-Дону'},
];
const grid = document.getElementById('cards');
function render(list) {
  grid.innerHTML = list.map(s=>{
    return `<article class="card">
      <img src="${s.img}" alt="${s.title}">
      <div class="card-content">
        <h2>${s.title}</h2>
        <div class="meta"><span>${s.location}</span> | <span>${s.price}₽</span></div>
        <div class="rating">★ ${s.rating}</div>
      </div>
    </article>`;
  }).join('');
}
render(services);
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  render(services.filter(s=>s.title.toLowerCase().includes(q)));
});
</script>
</body>
</html>
