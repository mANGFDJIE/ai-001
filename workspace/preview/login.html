<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #2a313c;
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .login-card h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .login-card p.sub {
      text-align: center;
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #b1bac4;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #58a6ff;
    }
    .form-group input::placeholder {
      color: #484f58;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      background: #2ea043;
    }
    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      min-height: 20px;
    }
    .message.error {
      color: #f85149;
    }
    .message.success {
      color: #3fb950;
    }
    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .footer-link a {
      color: #58a6ff;
      text-decoration: none;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 Вход</h1>
    <p class="sub">Введите свои учётные данные</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" placeholder="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Войти</button>
    </form>

    <div id="message" class="message"></div>

    <div class="footer-link">
      <a href="#">Забыли пароль?</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        msg.className = 'message error';
        msg.textContent = '⚠️ Заполните оба поля';
        return;
      }

      // Имитация отправки
      msg.className = 'message success';
      msg.textContent = `✅ Добро пожаловать, ${username}! (демо)`;

      // Через пару секунд можно очистить форму (для демо)
      // form.reset();
    });
  </script>
</body>
</html>
