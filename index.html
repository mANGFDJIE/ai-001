<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Task Board</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Mini Task Board</h1>
        <p>Добавляйте задачи и следите за прогрессом.</p>

        <form id="task-form">
          <input id="task-input" type="text" placeholder="Введите задачу" maxlength="80" required />
          <button type="submit">Добавить</button>
        </form>

        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
